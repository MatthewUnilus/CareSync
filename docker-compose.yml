services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caresync
      POSTGRES_USER: caresync
      POSTGRES_PASSWORD: caresync
    ports:
      - "5432:5432"
    volumes:
      - caresync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caresync -d caresync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caresync_pgdata:
