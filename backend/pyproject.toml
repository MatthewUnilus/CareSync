[project]
name = "triageassist-api"
version = "0.1.0"
description = "TriageAssist HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "en-core-web-sm",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "spacy>=3.8",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
# The project lives on a filesystem where uv's hardlink optimisation fails.
# Copying is slower but keeps `uv run` working from a clean checkout.
link-mode = "copy"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
